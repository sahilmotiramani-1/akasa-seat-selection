<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akasa Air - Seat Selection</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; color: #222; }
  /* Hide Skip controls if injected by the host/webview */
  button.skip, #skip, #skip-btn, .skip-btn, [data-action="skip"] { display: none !important; }

  /* ── FLIGHT SEGMENT TABS — very top, full width ── */
  .flight-tabs-bar {
    background: #fff8f2;
    border-bottom: 2px solid #e8630a;
    display: flex;
    overflow-x: auto;
  }
  .flight-tab {
    flex: 1; min-width: 140px;padding: 12px 20px;font-size: 14px; font-weight: 600; color: #888;background: transparent; border: none; cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    white-space: nowrap; text-align: center;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .flight-tab:hover { color: #e8630a; background: #fff3ec; }
  .flight-tab.active {
    color: #e8630a; font-weight: 700;
    border-bottom: 3px solid #e8630a;
    background: #fff;
  }
  /* completion tick on done tabs */
  .flight-tab.done::after { content: ' ✓'; color: #22a06b; }

  /* ── SECTOR INFO BAR ── */
  .sector-bar {
    background: #fff; border-bottom: 1px solid #e5e7eb;
    padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .sector-info { display: flex; flex-direction: column; gap: 2px; }
  .sector-route { font-size: 16px; font-weight: 700; color: #1a1a2e; }
  .sector-pill  { background: #fff8f2; color: #c05000; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; margin-top: 2px; }
  /* ── PAX BAR ── */
  .pax-bar {
    background: #fff; border-bottom: 1px solid #e5e7eb;
    padding: 10px 20px; display: flex; align-items: center; gap: 12px;
    overflow-x: auto;
  }
  .seat-count { font-size: 12px; font-weight: 600; color: #333; border-right: 1px solid #ddd; padding-right: 14px; min-width: 80px; line-height: 1.5; flex: 0 0 auto; }
  .pax-card { border: 1.5px solid #e8630a; border-radius: 8px; padding: 8px 14px; background: #fff; cursor: pointer; transition: all 0.15s; flex: 0 0 auto; min-width: 160px; }
  .pax-card:hover { background: #fff8f2; }
  .pax-card.active-pax { background: #fff3ec; }
  .pax-name   { font-size: 13px; font-weight: 700; color: #222; }
  .pax-action { font-size: 11px; color: #999; margin-top: 2px; }
  .pax-card.has-seat .pax-action { display: none; }
  .pax-seat-row { display: none; margin-top: 4px; }
  .pax-card.has-seat .pax-seat-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .pax-seat-num    { font-size: 12px; font-weight: 700; color: #1a1a2e; }
  .pax-seat-detail { font-size: 10px; color: #777; }
  .pax-change      { font-size: 10px; color: #5c0fd9; text-decoration: underline; cursor: pointer; white-space: nowrap; }

  /* ── PROMO / LEGEND ── */
  .promo-bar {
    background: #fff8f2; border-bottom: 1px solid #fcd6b0;
    padding: 7px 20px; display: flex; align-items: center; justify-content: space-between;
  }
  .promo-text { font-size: 12px; color: #c05000; font-weight: 500; }
  .legend     { display: flex; gap: 14px; align-items: center; }
  .leg-item   { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #555; }
  .leg-swatch { width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid; }

  /* ── SEATMAP ── */
  .main { background: #f0f0f0; min-height: calc(100vh - 210px); }
  .seatmap-area { width: 100%; overflow-x: auto; padding: 16px 18px 24px; display: flex; justify-content: flex-start; }
  .aircraft-wrap {
    display: block;
    width: max-content;
    margin: 0 auto;
    transform: scale(1.35);
    transform-origin: top left;
}

  #loading   { text-align: center; padding: 40px; color: #888; font-size: 14px; }
  #error-box { display: none; margin: 20px; padding: 20px; background: #fff8f2; border: 1.5px solid #e8630a; border-radius: 8px; font-size: 13px; line-height: 1.8; color: #333; }
  #error-box strong { color: #c00; font-size: 15px; display: block; margin-bottom: 8px; }
  #error-box code   { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-family: monospace; font-size: 12px; }
  /* ── SEATMAP ALIGNMENT: A B C | D E F ── */
  .col-headers {
    display: flex;
    align-items: center;
    gap: 3px;
    margin-bottom: 4px;
  }
  .col-hdr {
    width: 38px;
    flex: 0 0 38px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: #666;
  }
  .aisle-space {
    width: 22px;
    flex: 0 0 22px;
  }
  .seat-row {
    display: flex;
    align-items: center;
    gap: 3px;
    margin: 1.5px 0;
  }
  .row-num {
    width: 24px;
    flex: 0 0 24px;
    text-align: right;
    font-size: 10px;
    color: #aaa;
    padding-right: 4px;
  }
  .seat {
    width: 38px; height: 32px; border-radius: 4px; border: 1.5px solid;
    font-size: 8.5px; font-weight: 600; display: flex; align-items: center;
    justify-content: center; cursor: pointer; text-align: center; line-height: 1.2;
    transition: transform 0.1s, box-shadow 0.1s; user-select: none; flex-shrink: 0;
  }
  .seat:hover:not(.s-occ):not(.s-empty):not(.s-blocked) { transform: scale(1.1); box-shadow: 0 2px 8px rgba(0,0,0,0.18); z-index: 2; position: relative; }
  .s-std    { background: #fff;    border-color: #ccc;    color: #666; }
  .s-recliner { background: #f7f2ff; border-color: #8b5cf6; color: #5b21b6; }
  .s-non-reclining { background: #fff1f1; border-color: #d32f2f; color: #b71c1c; box-shadow: inset 0 0 0 1px rgba(211,47,47,.15); }
  .s-leg    { background: #fff8e1; border-color: #e8630a; color: #b84000; }
  .s-occ    { background: #f3f4f6; border-color: #bfc3c8; color: #777; cursor: not-allowed; }
  .s-sel    { background: #1a73e8; border-color: #0d5cb6; color: #fff; }
  .s-empty  { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
  .s-blocked{ background: #f3f4f6; border-color: #ddd; color: #bbb; cursor: not-allowed; }

  /* Exit indicator now sits beside its own row (like a small door tag at each
     end of the exit-row seats) instead of consuming a whole extra "row" of
     seat-sized cells above/below the grid. */
  .exit-tag {
    width: 100%; min-width: 0; height: 24px; flex: 1 1 auto;
    background: #df1010; color: #fff; font-size: 11px; font-weight: 800;
    border-radius: 5px; display: flex; align-items: center; justify-content: center;
    letter-spacing: 0.2px;
  }
  .exit-tag-slot { width: 100%; min-width: 0; height: 24px; flex: 1 1 auto; }
  
  /* ── BOTTOM BAR ── */
  .bottom-bar {
    background: #fff; border-top: 2px solid #e5e7eb;
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; bottom: 0; z-index: 100;
  }
  .price-info { display: flex; flex-direction: column; gap: 2px; }
  .price-total { font-size: 20px; font-weight: 800; color: #e8630a; }
  .price-link  { font-size: 11px; color: #888; cursor: pointer; text-decoration: underline; }
  .action-area { display: flex; align-items: center; gap: 12px; }
  .btn-action  { border: none; padding: 10px 26px; border-radius: 5px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
  .btn-secondary { background: #fff; color: #e8630a; border: 1.5px solid #e8630a; }
  .btn-secondary:hover { background: #fff8f2; }
  .btn-primary   { background: #e8630a; color: #fff; }
  .btn-primary:hover   { background: #c95500; }

  /* next-flight button (shown when on first tab and all pax have seats) */
  .btn-next { background: #1a73e8; color: #fff; }
  .btn-next:hover { background: #1558b0; }
  
  .seat-tooltip {
    position: fixed; background: #222; color: #fff; font-size: 11px; padding: 6px 10px;
    border-radius: 4px; pointer-events: none; z-index: 9999; display: none;
    white-space: nowrap; line-height: 1.6;
  }
  
  @media (max-width: 768px) {
    .col-headers,
    .seat-row {
      grid-template-columns: 20px repeat(3, 28px) 14px repeat(3, 28px);
      column-gap: 2px;
    }
    .seat { width: 28px; height: 24px; font-size: 6.5px; }
    .col-hdr { width: 28px; font-size: 7px; }
    .exit-tag, .exit-tag-slot { width: 12px; min-height: 24px; font-size: 6px; }
    .aisle-space { width: 14px; }
    .row-num { width: 20px; font-size: 8px; }
    .bottom-bar { padding: 8px 12px; flex-wrap: wrap; gap: 8px; }
    .btn-action { padding: 8px 14px; font-size: 12px; }
  }
  @media (max-width: 480px) {
    .col-headers,
    .seat-row {
      grid-template-columns: 15px repeat(3, 23px) 10px repeat(3, 23px);
      column-gap: 1.5px;
    }
    .seat { width: 23px; height: 20px; font-size: 5px; }
    .col-hdr { width: 23px; }
    .exit-tag, .exit-tag-slot { width: 9px; min-height: 20px; font-size: 5px; }
    .aisle-space { width: 10px; }
    .row-num { width: 15px; font-size: 6px; }
    .seat-row { margin: 0.5px 0; }
  }
</style>
</head>
<body>

<!-- ① FLIGHT SEGMENT TABS — full-width at the very top -->
<div class="flight-tabs-bar" id="flight-tabs-bar" style="display:none;"></div>

<!-- ② SECTOR INFO BAR -->
<div class="sector-bar">
  <div class="sector-info">
    <div class="sector-route" id="sector-route">Loading...</div>
    <span class="sector-pill"  id="sector-flight">Flight details</span>
  </div>
</div>

<!-- ③ PAX BAR -->
<div class="pax-bar" id="pax-bar">
  <div class="seat-count" id="seat-count-display">0/0 Seats<br>selected</div>
  <!-- cards injected by JS -->
</div>

<!-- ④ PROMO / LEGEND -->
<div class="promo-bar">
  <span class="promo-text">Enjoy generous legroom on our seats starting at just ₹150</span>
  <div class="legend">
    <div class="leg-item"><div class="leg-swatch" style="background:#fff8e1;border-color:#e8630a;"></div> A+</div>
    <div class="leg-item"><div class="leg-swatch" style="background:#fff1f1;border-color:#d32f2f;"></div> Non-reclining</div>
    <div class="leg-item"><div class="leg-swatch" style="background:#f7f2ff;border-color:#8b5cf6;"></div> Recliner</div>
    <div class="leg-item"><div class="leg-swatch" style="background:#f3f4f6;border-color:#bfc3c8;"></div> Occupied</div>
  </div>
</div>

<!-- ⑤ SEATMAP -->
<div class="main">
  <div class="seatmap-area">
    <div id="loading">Loading seat map…</div>
    <div id="error-box"></div>
    <div class="aircraft-wrap" id="seatmap-root" style="display:none;"></div>
  </div>
</div>

<!-- ⑥ BOTTOM BAR -->
<div class="bottom-bar">
  <div class="price-info">
    <div class="price-total" id="price-display">Loading...</div>
    <!-- <div class="price-link" onclick="toggleSummary()">View summary</div> -->
  </div>
  <div class="action-area">
    <button class="btn-action btn-primary"   id="confirm-btn" onclick="handleConfirm()">Confirm seat</button>
  </div>
</div>

<div class="seat-tooltip" id="tooltip"></div>

<script>
const BASE_PRICE = 0;

let passengerNames = [];
let numPax = 3;
let currentPaxId = 1;
let currentFlightIdx = 0;
let perFlightSeats = [];
let allParsedMaps = [];
let preferredSeats = [];
let apiBaseUrl = '';
let authToken = '';
let qpApiKey = '';
let qpSource = 'CHATBOTWEB';
let journeyKeys = [];
let passengerKeys = [];
let customerNumber = '';
let pnr = '';
let tripSummary = '';
let totalAmount = 0;
let currencyCode = 'INR';
let segmentMap = [];

function showLoading(v) { document.getElementById('loading').style.display = v ? 'block' : 'none'; }
function showError(html) {
  const b = document.getElementById('error-box');
  b.style.display = 'block'; b.innerHTML = html;
}
function showMap() {
  document.getElementById('seatmap-root').style.display = 'block';
}
function getQueryParam(name) {
  return new URLSearchParams(window.location.search).get(name) || '';
}
function buildSeatMapPayload(raw) {
  let flightList = [];
  if (Array.isArray(raw?.data) && raw.data.length > 0) {
    raw.data.forEach(item => flightList.push(item?.seatMapAvailability ?? item));
  } else if (raw?.seatMapAvailability) {
    flightList = [raw.seatMapAvailability];
  } else {
    flightList = [raw];
  }
  return flightList;
}
async function fetchSeatMapFromApi() {
  const headers = {
    'Authorization': authToken,
    'Content-Type': 'application/json',
    'QP-BOT-API-KEY': qpApiKey,
    'QP-BOT-SOURCE': qpSource
  };
  const response = await fetch(`${apiBaseUrl}/api/ibe/agents/seatmap`, { headers });
  if (!response.ok) throw new Error(`Seatmap API failed (${response.status})`);
  return response.json();
}

async function fetchPreferredSeatsFromApi() {
  if (!customerNumber) return [];
  const headers = {
    'Authorization': authToken,
    'QP-BOT-API-KEY': qpApiKey,
    'QP-BOT-SOURCE': qpSource
  };
  const response = await fetch(`${apiBaseUrl}/api/ibe/agents/preferred-seats?customerNumber=${encodeURIComponent(customerNumber)}`, { headers });
  if (!response.ok) return [];
  const json = await response.json();
  return Array.isArray(json?.data) ? json.data : [];
}

function isPreferredSeat(info, paxIndex) {
  const paxKey = passengerKeys[paxIndex - 1] || '';
  const seatCode = (info?.des || '').toUpperCase();
  return preferredSeats.some(item => {
    const preferredSeat = (item?.seat || '').toUpperCase();
    const samePassenger = !paxKey || !item?.paxKey || item.paxKey === paxKey;
    return samePassenger && preferredSeat && preferredSeat === seatCode;
  });
}

async function loadAndRenderFromApi() {
  showLoading(true);
  try {
    const seatMapResponse = await fetchSeatMapFromApi();
    preferredSeats = await fetchPreferredSeatsFromApi();
    const flightList = buildSeatMapPayload(seatMapResponse);
    renderSeatMapData(flightList);
    showLoading(false);
    showMap();
  } catch (err) {
    showLoading(false);
    showError(`<strong>⚠ Could not load seat map</strong> ${err.message}<br><br>
      <b>Common fixes:</b><br>• Verify the bot passed a valid auth token and API base URL`);
  }
}

function renderSeatMapData(flightList) {
  // FIXED: Properly extract passenger names from query params if provided
  const queryPassengerNames = getQueryParam('passenger_names');
  if (queryPassengerNames) {
    passengerNames = queryPassengerNames.split(',').map(name => name.trim()).filter(Boolean);
  } else {
    passengerNames = extractPassengerNames(flightList[0] || {});
  }
  
  numPax = passengerNames.length || 3;
  if (passengerNames.length === 0) {
    for (let i = 1; i <= numPax; i++) passengerNames.push(`Passenger ${i}`);
  }
const tripLabels = tripSummary
  ? tripSummary.split("|").map(s => s.trim())
  : [];

allParsedMaps = flightList.map((fd, fi) => {
  perFlightSeats[fi] = {};
  for (let p = 1; p <= numPax; p++) {
    perFlightSeats[fi][p] = {
      seat: null,
      fee: 0,
      detail: '',
      unitKey: null
    };
  }

  return {
    data: fd,
    parsed: parseSeatMap(fd),

    // Use the corresponding route from trip_summary
    label: tripLabels[fi] || `Flight ${fi + 1}`,

    flightNum: buildFlightNum(fd),
    journeyKey: resolveJourneyKeyForFlight(fd, fi)
  };
});

  buildFlightTabs();
  buildPaxCards();
  switchToFlight(0);
}

function buildFlightLabel(data) {
    const root = data?.seatMap ?? data;
    const seg = (root?.segments ?? root?.legs ?? [])[0];

    if (seg) {
        const from = seg.departureStation || seg.origin || seg.from;
        const to = seg.arrivalStation || seg.destination || seg.to;

        if (from && to) {
            return `${from} → ${to}`;
        }
    }

    return "Flight";
}

function buildFlightNum(data) {
  const root = data?.seatMap ?? data;
  return root?.name ? `Flight ${root.name}` : 'Flight details';
}

function buildFlightTabs() {
  const bar = document.getElementById('flight-tabs-bar');
  bar.innerHTML = '';
  if (allParsedMaps.length <= 1) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  allParsedMaps.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'flight-tab' + (i === 0 ? ' active' : '');
    btn.id = `ftab-${i}`;
    btn.textContent = m.label;
    btn.onclick = () => switchToFlight(i);
    bar.appendChild(btn);
  });
}

function updateFlightTabs() {
  allParsedMaps.forEach((_, i) => {
    const btn = document.getElementById(`ftab-${i}`);
    if (!btn) return;
    btn.className = 'flight-tab' + (i === currentFlightIdx ? ' active' : '');
    const seats = perFlightSeats[i] ?? {};
    const allDone = Object.values(seats).every(s => s.seat !== null);
    if (allDone && i !== currentFlightIdx) btn.classList.add('done');
  });
}

function buildPaxCards() {
  const bar = document.getElementById('pax-bar');
  bar.innerHTML = `<div class="seat-count" id="seat-count-display">0/${numPax} Seats<br>selected</div>`;
  for (let i = 1; i <= numPax; i++) {
    const div = document.createElement('div');
    div.className = 'pax-card' + (i === 1 ? ' active-pax' : '');
    div.id = `pax-${i}`;
    div.innerHTML = `
      <div class="pax-name">${passengerNames[i - 1]}</div>
      <div class="pax-action">Select seat</div>
      <div class="pax-seat-row">
        <div>
          <div class="pax-seat-num" id="pax-${i}-seat"></div>
          <div class="pax-seat-detail" id="pax-${i}-detail"></div>
        </div>
        <div class="pax-change">Change</div>
      </div>`;
    div.addEventListener('click', () => selectPax(i));
    bar.appendChild(div);
  }
}

function selectPax(i) {
  currentPaxId = i;
  document.querySelectorAll('.pax-card').forEach(c => c.classList.remove('active-pax'));
  document.getElementById(`pax-${i}`)?.classList.add('active-pax');
  refreshSeatVisuals();
}

function switchToFlight(idx) {
  currentFlightIdx = idx;
  currentPaxId = 1;
  selectPax(1);

  const m = allParsedMaps[idx];
  document.getElementById('sector-route').textContent = m.label;
  document.getElementById('sector-flight').textContent = m.flightNum;

  renderSeatMap(m.parsed);
  updateUIForFlight();
  updateFlightTabs();
  updateConfirmButton();
}

function updateUIForFlight() {
  const seats = perFlightSeats[currentFlightIdx] ?? {};
  const sel = Object.values(seats).filter(s => s.seat).length;
  document.getElementById('seat-count-display').innerHTML = `${sel}/${numPax} Seats<br>selected`;

  for (let i = 1; i <= numPax; i++) {
    const card = document.getElementById(`pax-${i}`);
    const sn = document.getElementById(`pax-${i}-seat`);
    const sd = document.getElementById(`pax-${i}-detail`);
    if (!card) continue;
    const info = seats[i] ?? {};
    if (info.seat) {
      sn.textContent = info.seat;
      sd.textContent = info.detail ?? '';
      card.classList.add('has-seat');
    } else {
      sn.textContent = '';
      sd.textContent = '';
      card.classList.remove('has-seat');
    }
  }

  // Show only the seat-selection fee total, not the ticket price.
  // Starts at 0 and increases as seats are selected.
  let totalFee = 0;
  perFlightSeats.forEach(fs => { Object.values(fs).forEach(p => { totalFee += p.fee; }); });
  const priceDisplay = document.getElementById('price-display');
  priceDisplay.textContent = currencyCode + ' ' + totalFee.toLocaleString('en-IN');
}

function updateConfirmButton() {
  const btn = document.getElementById('confirm-btn');
  const isLast = currentFlightIdx === allParsedMaps.length - 1;
  if (!isLast) {
    btn.textContent = 'Next flight →';
    btn.className = 'btn-action btn-next';
  } else {
    btn.textContent = 'Confirm seat';
    btn.className = 'btn-action btn-primary';
  }
}

function handleConfirm() {
  const isLast = currentFlightIdx === allParsedMaps.length - 1;
  if (!isLast) {
    switchToFlight(currentFlightIdx + 1);
    document.getElementById(`ftab-${currentFlightIdx}`)?.scrollIntoView({ behavior: 'smooth', inline: 'center' });
  } else {
    confirmSeat();
  }
}

function parseSeatMap(data) {
  const root = data?.seatMap ?? data;
  const decks = root?.decks ?? {};
  const deck1 = decks['1'] ?? Object.values(decks)[0] ?? {};
  const allUnits = [];
  Object.values(deck1?.compartments ?? {}).forEach(comp => {
    if (Array.isArray(comp.units)) allUnits.push(...comp.units);
  });
  if (allUnits.length === 0) throw new Error('No seat units found in JSON.');

  const fees = {};
  Object.values(data?.fees ?? {}).forEach(paxFees => {
    Object.values(paxFees?.groups ?? {}).forEach(grp => {
      const sfe = (grp?.fees ?? []).flatMap(f => f?.serviceCharges ?? []).find(s => s.code === 'SFE');
      if (sfe != null && !(grp.group in fees)) fees[grp.group] = sfe.amount;
    });
  });

  const hasProp = (u, code) => (u.properties ?? []).some(
    p => String(p?.code ?? '').toUpperCase() === code.toUpperCase() &&
         String(p?.value ?? '').toLowerCase() === 'true'
  );

  // Akasa/QP seat-map payloads can use slightly different property names.
  // Detect both the explicit codes and descriptive variants.
  const hasPropertyLike = (u, regex) => (u.properties ?? []).some(p =>
    regex.test(String(p?.code ?? '').toUpperCase()) &&
    String(p?.value ?? '').toLowerCase() === 'true'
  );

  const rowMap = {};
  allUnits.forEach(u => {
    if (!u.designator || u.designator.startsWith('$')) return;
    const m = u.designator.match(/^(\d+)([A-Z])$/); if (!m) return;
    const row = +m[1], col = m[2];
    if (!rowMap[row]) rowMap[row] = {};
    const availabilityText = (u.availability ?? '').toString().toLowerCase();
    const isOpen = availabilityText === 'open';
    rowMap[row][col] = {
      des: u.designator,
      key: u.unitKey,
      avail: isOpen ? 1 : 0,
      assignable: !!u.assignable && isOpen,
      group: u.group ?? 0,
      price: fees[u.group] ?? 0,
      isWindow: hasProp(u, 'WINDOW'),
      isAisle: hasProp(u, 'AISLE'),
      isLeg: hasProp(u, 'LEGROOM'),
      isExit: hasProp(u, 'EXITROW'),
      isDisab: hasProp(u, 'DISABIL'),
      isPet: hasProp(u, 'PET'),
      noChild: hasProp(u, 'NCHILD'),

      // Seat type comes directly from the QP/Akasa seat-map property.
      // RECLINE=True  -> recliner
      // RECLINE=False -> non-reclining
      // Missing RECLINE -> leave as standard/unknown.
      hasReclineProperty: (u.properties ?? []).some(
        p => String(p?.code ?? '').toUpperCase() === 'RECLINE'
      ),
      isRecliner: hasProp(u, 'RECLINE'),
      isNonReclining: (u.properties ?? []).some(
        p => String(p?.code ?? '').toUpperCase() === 'RECLINE' &&
             String(p?.value ?? '').toLowerCase() === 'false'
      )
    };
  });
  return { rowMap, sortedRows: Object.keys(rowMap).map(Number).sort((a, b) => a - b) };
}

function buildSeatDetail(info) {
  if (!info) return '';
  const position = info.isWindow ? 'Window'
    : info.isAisle ? 'Aisle'
    : info.isLeg ? 'Extra legroom'
    : info.isExit ? 'Exit row'
    : 'Middle';

  const type = info.isRecliner ? 'Recliner'
    : info.isNonReclining ? 'Non-reclining'
    : '';

  return type ? `${position} • ${type}` : position;
}

function extractPassengerNames(data) {
  const list = data?.passengers ?? data?.passengerList ?? data?.passengerDetails ?? data?.passenger ?? [];
  if (!Array.isArray(list)) return [];
  return list.map(item => item?.name || [item?.firstName, item?.lastName].filter(Boolean).join(' ')).filter(Boolean);
}

function renderSeatMap({ rowMap, sortedRows }) {
  const root = document.getElementById('seatmap-root');
  root.innerHTML = '';

  // Fixed 6-seat layout: A B C | D E F.
  // Missing seats are represented by empty placeholders, never removed,
  // so every row stays aligned with every other row.
  const LEFT = ['A', 'B', 'C'];
  const RIGHT = ['D', 'E', 'F'];

  const gridTemplate = '24px 38px 38px 38px 22px 38px 38px 38px';

  const hdr = document.createElement('div');
  hdr.className = 'col-headers';
  hdr.style.display = 'grid';
  hdr.style.gridTemplateColumns = gridTemplate;
  hdr.style.columnGap = '3px';
  hdr.style.alignItems = 'center';

  const blank = document.createElement('div');
  hdr.appendChild(blank);

  LEFT.forEach(c => {
    const d = document.createElement('div');
    d.className = 'col-hdr';
    d.textContent = c;
    hdr.appendChild(d);
  });

  const aisleHdr = document.createElement('div');
  aisleHdr.className = 'aisle-space';
  hdr.appendChild(aisleHdr);

  RIGHT.forEach(c => {
    const d = document.createElement('div');
    d.className = 'col-hdr';
    d.textContent = c;
    hdr.appendChild(d);
  });

  root.appendChild(hdr);

  sortedRows.forEach(rowNum => {
    const rowData = rowMap[rowNum] ?? {};
    const isExit = Object.keys(rowData).some(c => rowData[c]?.isExit);

    // Exit indicator sits above/below the actual row, matching the reference UI.
    if (isExit) {
      const exitRow = document.createElement('div');
      exitRow.style.display = 'grid';
      exitRow.style.gridTemplateColumns = gridTemplate;
      exitRow.style.columnGap = '3px';
      exitRow.style.height = '24px';
      exitRow.style.margin = '2px 0';

      const leftExit = document.createElement('div');
      leftExit.style.gridColumn = '2 / span 3';
      leftExit.className = 'exit-tag';
      leftExit.textContent = 'Exit';
      exitRow.appendChild(leftExit);

      const rightExit = document.createElement('div');
      rightExit.style.gridColumn = '6 / span 3';
      rightExit.className = 'exit-tag';
      rightExit.textContent = 'Exit';
      exitRow.appendChild(rightExit);

      root.appendChild(exitRow);
    }

    const rowDiv = document.createElement('div');
    rowDiv.className = 'seat-row';
    rowDiv.style.display = 'grid';
    rowDiv.style.gridTemplateColumns = gridTemplate;
    rowDiv.style.columnGap = '3px';
    rowDiv.style.alignItems = 'center';

    const numDiv = document.createElement('div');
    numDiv.className = 'row-num';
    numDiv.textContent = rowNum;
    rowDiv.appendChild(numDiv);

    LEFT.forEach(c => rowDiv.appendChild(buildSeat(rowData[c], rowNum, c)));

    const aisle = document.createElement('div');
    aisle.className = 'aisle-space';
    rowDiv.appendChild(aisle);

    RIGHT.forEach(c => rowDiv.appendChild(buildSeat(rowData[c], rowNum, c)));

    root.appendChild(rowDiv);

    if (isExit) {
      const exitRow = document.createElement('div');
      exitRow.style.display = 'grid';
      exitRow.style.gridTemplateColumns = gridTemplate;
      exitRow.style.columnGap = '3px';
      exitRow.style.height = '24px';
      exitRow.style.margin = '2px 0';

      const leftExit = document.createElement('div');
      leftExit.style.gridColumn = '2 / span 3';
      leftExit.className = 'exit-tag';
      leftExit.textContent = 'Exit';
      exitRow.appendChild(leftExit);

      const rightExit = document.createElement('div');
      rightExit.style.gridColumn = '6 / span 3';
      rightExit.className = 'exit-tag';
      rightExit.textContent = 'Exit';
      exitRow.appendChild(rightExit);

      root.appendChild(exitRow);
    }
  });

  // Bottom column numbers shown in the reference.
  const maxCol = 30;
  const bottom = document.createElement('div');
  bottom.style.display = 'grid';
  bottom.style.gridTemplateColumns = '24px repeat(3, 38px) 22px repeat(3, 38px)';
  bottom.style.columnGap = '3px';
  bottom.style.marginTop = '5px';
  bottom.style.alignItems = 'center';

  const bottomBlank = document.createElement('div');
  bottom.appendChild(bottomBlank);

  for (let i = 1; i <= 30; i++) {
    const d = document.createElement('div');
    d.style.fontSize = '11px';
    d.style.color = '#444';
    d.style.textAlign = 'center';
    d.textContent = i;
    bottom.appendChild(d);

    if (i === 3 || i === 6) {
      const spacer = document.createElement('div');
      spacer.style.display = 'none';
    }
  }
}
function buildExitTag(isExit) {
  const d = document.createElement('div');
  if (isExit) {
    d.className = 'exit-tag';
    d.textContent = 'Exit';
  } else {
    d.className = 'exit-tag-slot';
  }
  return d;
}

function buildSeat(info, rowNum, col) {
  const div = document.createElement('div');
  div.className = 'seat';

  if (!info) {
    div.classList.add('s-empty');
    return div;
  }

  const occ = !info.assignable || info.avail === 0;

  if (occ) {
    // BOOKED / UNAVAILABLE: never show price.
    div.classList.add('s-occ');
    div.textContent = '✕';
    div.title = `${info.des} — Occupied`;
  } else if (info.isLeg || info.isExit) {
    div.classList.add('s-leg');
    div.textContent = info.price === 0 ? 'Free' : '₹' + info.price;
  } else if (info.isRecliner) {
    div.classList.add('s-recliner');
    div.textContent = info.price === 0 ? 'Free' : '₹' + info.price;
  } else if (info.isNonReclining) {
    div.classList.add('s-non-reclining');
    div.textContent = info.price === 0 ? 'Free' : '₹' + info.price;
  } else {
    div.classList.add('s-std');
    div.textContent = info.price === 0 ? 'Free' : '₹' + info.price;
  }

  div.dataset.rowCol = `${rowNum}${col}`;
  div.dataset.price = info.price;
  div.dataset.isLeg = info.isLeg ? '1' : '0';
  div.dataset.isExit = info.isExit ? '1' : '0';
  div.dataset.isRecliner = info.isRecliner ? '1' : '0';
  div.dataset.isNonReclining = info.isNonReclining ? '1' : '0';
  div.dataset.isWindow = info.isWindow ? '1' : '0';
  div.dataset.isAisle = info.isAisle ? '1' : '0';
  div.dataset.occupied = occ ? '1' : '0';

  if (!occ) {
    div.addEventListener('click', () => handleSeatClick(div, info, rowNum, col));
  }

  div.addEventListener('mouseenter', e => showTip(e, info, rowNum, col));
  div.addEventListener('mouseleave', hideTip);
  div.addEventListener('mousemove', moveTip);

  return div;
}

function flightSeats() { return perFlightSeats[currentFlightIdx]; }

function isSeatTakenByOther(id, pax) {
  const seats = flightSeats();
  for (let i = 1; i <= numPax; i++) if (i !== pax && seats[i]?.seat === id) return true;
  return false;
}

function handleSeatClick(div, info, rowNum, col) {
  const id = `${rowNum}${col}`;
  const seats = flightSeats();
  if (isSeatTakenByOther(id, currentPaxId)) { alert('This seat is already selected by another passenger.'); return; }

  const prev = seats[currentPaxId]?.seat;
  if (prev) {
    const pd = document.querySelector(`[data-row-col="${prev}"]`);
    if (pd) {
      pd.classList.remove('s-sel');
      pd.classList.add((pd.dataset.isLeg === '1' || pd.dataset.isExit === '1') ? 's-leg' : 's-std');
      pd.textContent = +pd.dataset.price === 0 ? 'Free' : '₹' + pd.dataset.price;
    }
  }

  if (seats[currentPaxId]?.seat === id) {
    seats[currentPaxId] = { seat: null, fee: 0, detail: '', unitKey: null };
    refreshSeatVisuals(); updateUIForFlight(); return;
  }

  div.classList.remove('s-std', 's-leg'); div.classList.add('s-sel'); div.textContent = id;
  seats[currentPaxId] = { seat: id, fee: info.price, detail: buildSeatDetail(info), unitKey: info.key };

  const nextUnsated = Object.keys(seats).map(Number).find(p => p > currentPaxId && !seats[p]?.seat);
  if (nextUnsated) selectPax(nextUnsated);

  refreshSeatVisuals(); updateUIForFlight(); updateFlightTabs();
}

function refreshSeatVisuals() {
  const seats = flightSeats();

  document.querySelectorAll('.seat').forEach(seat => {
    const rc = seat.dataset.rowCol;
    if (!rc) return;

    // Seats already occupied in the API must always remain X and must never
    // be overwritten with a price while changing passenger selection.
    if (seat.dataset.occupied === '1') {
      seat.classList.remove('s-sel', 's-blocked', 's-std', 's-leg', 's-recliner', 's-non-reclining');
      seat.classList.add('s-occ');
      seat.textContent = '✕';
      return;
    }

    const mine = seats[currentPaxId]?.seat === rc;
    const other = isSeatTakenByOther(rc, currentPaxId);

    seat.classList.remove('s-sel', 's-blocked', 's-std', 's-leg', 's-recliner', 's-non-reclining');

    if (mine) {
      seat.classList.add('s-sel');
      seat.textContent = rc;
    } else if (other) {
      seat.classList.add('s-blocked');
      seat.textContent = '✕';
    } else {
      if (seat.dataset.isLeg === '1' || seat.dataset.isExit === '1') {
        seat.classList.add('s-leg');
      } else if (seat.dataset.isRecliner === '1') {
        seat.classList.add('s-recliner');
      } else if (seat.dataset.isNonReclining === '1') {
        seat.classList.add('s-non-reclining');
      } else {
        seat.classList.add('s-std');
      }

      seat.textContent = +seat.dataset.price === 0 ? 'Free' : '₹' + seat.dataset.price;
    }
  });
}

const tip = document.getElementById('tooltip');
function showTip(e, info, r, c) {
  const lines = [`Row ${r}, Seat ${c}`];
  if (info.isWindow) lines.push('Window');
  if (info.isAisle) lines.push('Aisle');
  if (info.isLeg) lines.push('Extra legroom');
  if (info.isExit) lines.push('Exit row');
  if (info.isPet) lines.push('Pet-friendly zone');
  if (info.noChild) lines.push('No children');
  if (info.isDisab) lines.push('Accessibility seat');
  if (isPreferredSeat(info, currentPaxId)) lines.push('Preferred seat');
  lines.push(info.avail === 0 ? 'Occupied' : 'Price: ' + (info.price === 0 ? 'Free' : '₹' + info.price));
  tip.innerHTML = lines.join('<br>'); tip.style.display = 'block'; moveTip(e);
}
function moveTip(e) { tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; }
function hideTip() { tip.style.display = 'none'; }

function buildSeatSelectionPayload() {
  const selectedItems = [];
  perFlightSeats.forEach((flightSeats, fi) => {
    const journeyKey = allParsedMaps[fi]?.journeyKey || journeyKeys[fi] || journeyKeys[0] || '';
    Object.entries(flightSeats || {}).forEach(([pid, seatInfo]) => {
      if (!seatInfo || !seatInfo.seat || !seatInfo.unitKey) return;
      const passengerKey = passengerKeys[Number(pid) - 1] || '';
      if (!journeyKey || !passengerKey) return;
      selectedItems.push(`${journeyKey}|${passengerKey}|${seatInfo.unitKey}`);
    });
  });
  return selectedItems.join(';');
}

function getSelectedSeatAmount() {
  let totalFee = 0;

  perFlightSeats.forEach(flightSeats => {
    Object.values(flightSeats || {}).forEach(seatInfo => {
      totalFee += Number(seatInfo?.fee || 0);
    });
  });

  return totalFee;
}

function sendSeatSelectionToBot(payload) {
  const parts = [];

  if (pnr) {
    parts.push(`pnr=${encodeURIComponent(pnr)}`);
  }

  // Calculate the exact amount for the seats selected by all passengers
  // across all flights.
  const seatAmount = getSelectedSeatAmount();

  parts.push(
    `journey_keys=${encodeURIComponent(journeyKeys.join(','))}`,
    `passenger_keys=${encodeURIComponent(passengerKeys.join(','))}`,
    `selected_seats=${encodeURIComponent(payload)}`,
    `seat_amount=${encodeURIComponent(seatAmount)}`,
    `seat_currency=${encodeURIComponent(currencyCode)}`
  );

  const data = parts.join('||');

  const encoded = encodeURIComponent(
    data.split(',').join(';;').split('&').join('^%')
  );

  const text = `{always execute function \`seat_selection\`,data:${encoded}}`;

  if (window.parent && window.parent !== window) {
    window.parent.postMessage(
      `http://haptik-webview//perform-action?action=close&message=${text}&message_type=0`,
      '*'
    );
  } else {
    console.log('Seat selection payload:', {
      payload: payload,
      seatAmount: seatAmount,
      currency: currencyCode
    });
  }
}

function toggleSummary() {
  if (tripSummary) {
    alert(`Trip Summary:\n${tripSummary}\n\nTotal: ${currencyCode} ${totalAmount.toLocaleString('en-IN')}`);
  } else {
    alert('No trip summary available');
  }
}

function confirmSeat() {
  const payload = buildSeatSelectionPayload();
  if (!payload) { alert('Please select seats for passengers.'); return; }
  const btn = document.getElementById('confirm-btn');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Submitting...';
  }
  setTimeout(() => sendSeatSelectionToBot(payload), 500);
}

function resolveJourneyKeyForFlight(fd, fi) {
  const root = fd?.seatMap ?? fd;
  const seg = (root?.segments ?? root?.legs ?? root?.journeys ?? [])[0] || {};
  const from = (seg.departureStation || seg.origin || seg.from || '').toUpperCase();
  const to = (seg.arrivalStation || seg.destination || seg.to || '').toUpperCase();

  const match = segmentMap.find(m =>
    (m.origin || '').toUpperCase() === from &&
    (m.destination || '').toUpperCase() === to
  );
  if (match) return match.journeyKey;

  // fallback for old data without segment_map
  return journeyKeys[fi] || journeyKeys[0] || '';
}

function init() {
  apiBaseUrl = getQueryParam('base_url') || '';
  authToken = getQueryParam('auth_token') || '';
  qpApiKey = getQueryParam('qp_bot_api_key') || '';
  qpSource = getQueryParam('qp_bot_source') || 'CHATBOTWEB';
  journeyKeys = (getQueryParam('journey_keys') || '').split(',').filter(Boolean);
  passengerKeys = (getQueryParam('passenger_keys') || '').split(',').filter(Boolean);
  customerNumber = getQueryParam('customer_number') || '';
  pnr = getQueryParam('pnr') || getQueryParam('record_locator') || '';
  try {
    segmentMap = JSON.parse(getQueryParam('segment_map') || '[]');
  } catch (e) { segmentMap = []; }
  
  // FIXED: Read trip_summary, total_amount, and currency from query params
  tripSummary = getQueryParam('trip_summary') || '';
  const amountStr = getQueryParam('total_amount');
  totalAmount = amountStr ? parseFloat(amountStr) : 0;
  currencyCode = getQueryParam('currency') || 'INR';

  if (apiBaseUrl && authToken) {
    loadAndRenderFromApi();
  } else {
    showError('<strong>⚠ Missing booking context</strong> The bot did not provide the required auth token and API base URL.');
  }
}

init();
</script>
